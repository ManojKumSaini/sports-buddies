<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Neighborhood Vibe</title>
    <style>
        body {
            font-family: sans-serif;
        }
        .section {
            border-bottom: 2px solid purple;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        .category {
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
        }
        .image-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .image-row img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .main-image {
            width: 150px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>Neighbor hood vibe</h1>
    <img class="main-image" src="{{ var_main_picture }}" alt="picture">

    <p>Name: {{ var_name }}</p>
    <p>Age: {{ var_age }}</p>
    <p>Street: {{ var_street }}</p>
    <p>City: {{ var_city }}</p>

    <img src="{{ var_vibe_picture }}" alt="picture" width="80">
    <p><i>{{ var_text1 }}</i> <b>{{ var_text2 }}</b> <i>{{ var_text3 }}</i></p>

    <div class="section">
        <div class="category">{{ var_type1 }}</div>
        <div class="image-row">
            <img src="{{ var_image1 }}" alt="picture">
            <img src="{{ var_image2 }}" alt="picture">
        </div>
    </div>

    <div class="section">
        <div class="category">Musik</div>
        <div class="image-row">
            <img src="{{ var_musik1 }}" alt="picture">
        </div>
        <div class="category">Sport</div>
        <div class="image-row">
            <img src="{{ var_sport1 }}" alt="picture">
            <img src="{{ var_sport2 }}" alt="picture">
            <img src="{{ var_sport3 }}" alt="picture">
        </div>
    </div>

    <div class="section">
        <div class="category">Sleeping</div>
        <div class="image-row">
            <img src="{{ var_sleeping }}" alt="picture">
        </div>
        <div class="category">Working</div>
        <div class="image-row">
            <img src="{{ var_working }}" alt="picture">
        </div>
    </div>

</body>
</html>
